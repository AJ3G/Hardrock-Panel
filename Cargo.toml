[workspace]
resolver = "3"
members = [
    "crates/hardrock",
    "crates/rigcat",
    "crates/hardrock-panel",
    "crates/elad-iq",
    "crates/sdr",
]
default-members = ["crates/hardrock-panel"]

[workspace.package]
version = "0.1.0"
edition = "2024"
# The panel's look and much of its code come from SDRoxide
# (https://github.com/dividebysandwich/sdroxide), which is GPL-3.0-or-later.
license = "GPL-3.0-or-later"
repository = "https://github.com/AJ3G/hardrock-panel"

[workspace.dependencies]
hardrock = { path = "crates/hardrock" }
rigcat = { path = "crates/rigcat" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
crossbeam-channel = "0.5"
elad-iq = { path = "crates/elad-iq" }
sdr = { path = "crates/sdr" }
# The panadapter's USB driver and DSP, both ported from SDRoxide.
nusb = "0.2.7"
rtrb = "0.4.0"
thiserror = "2"
num-complex = "0.4.6"
rustfft = "6.4.1"
cpal = "0.18.2"

[profile.release]
lto = "thin"
codegen-units = 4
