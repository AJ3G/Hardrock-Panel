[workspace]
resolver = "3"
members = ["crates/hardrock", "crates/hardrock-panel"]
default-members = ["crates/hardrock-panel"]

[workspace.package]
version = "0.1.0"
edition = "2024"
# The panel's look and much of its code come from SDRoxide
# (https://github.com/dividebysandwich/sdroxide), which is GPL-3.0-or-later.
license = "GPL-3.0-or-later"
repository = "https://github.com/AJ3G/hardrock-panel"

[workspace.dependencies]
hardrock = { path = "crates/hardrock" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
crossbeam-channel = "0.5"

[profile.release]
lto = "thin"
codegen-units = 4
