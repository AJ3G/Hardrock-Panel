name: Windows build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace
      - run: cargo build --release -p hardrock-panel
      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory dist | Out-Null
          Copy-Item target/release/hardrock-panel.exe dist/
          Copy-Item README.md, LICENSE, docs/user-guide.md, docs/safety-interlocks.md dist/
          Compress-Archive -Path dist/* -DestinationPath hardrock-panel-windows.zip
      - uses: actions/upload-artifact@v4
        with:
          name: hardrock-panel-windows
          path: hardrock-panel-windows.zip
      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: hardrock-panel-windows.zip
          prerelease: true
