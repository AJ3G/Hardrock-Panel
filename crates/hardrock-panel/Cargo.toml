[package]
name = "hardrock-panel"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "A standalone control panel for HobbyPCB Hardrock amplifiers and the ATU-500"

[dependencies]
hardrock.workspace = true
rigcat.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
# The panadapter: its spectrum frames, and half floats and plain bytes for the
# waterfall's GPU textures.
sdr.workspace = true
elad-iq.workspace = true
links.workspace = true
decoders.workspace = true
datalink.workspace = true
crossbeam-channel.workspace = true
# The CPU end of the scope's I/Q ring to the GPU.
rtrb.workspace = true
half = "2.7.1"
bytemuck = "1.25.2"
serialport = { version = "4.10", default-features = false }
# TUNE's tone, into the radio's USB audio.
cpal = "0.18.2"
# `accesskit` keeps the widgets visible to screen readers; `persistence` keeps
# the window's place and the settings between runs.
eframe = { version = "0.36.1", default-features = false, features = [
    "accesskit",
    "default_fonts",
    "wgpu",
    "wayland",
    "x11",
    "persistence",
] }

[dev-dependencies]
# Parses and validates the scope's WGSL in the tests, with no GPU.
naga = { version = "30.0.1", features = ["wgsl-in"] }
# The GPU spectrum's tests: a headless device, and the FFT to check it by.
pollster = "1.0.1"
rustfft.workspace = true
