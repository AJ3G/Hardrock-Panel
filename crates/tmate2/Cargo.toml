[package]
name = "tmate2"
version.workspace = true
edition.workspace = true
license.workspace = true

# The ELAD / WoodBoxRadio TMate 2 USB controller: a big tuning dial, two small
# dials and six keys under a segment LCD. Ported from SDRoxide's
# `sdroxide-tmate2` (https://github.com/dividebysandwich/sdroxide/pull/887),
# GPL-3.0-or-later like this workspace.
#
# Pure Rust and no system libraries: hidraw on Linux, `hid.dll` plus
# overlapped `ReadFile` / `WriteFile` on Windows. ELAD's own DLL is not used.
[dependencies]
crossbeam-channel.workspace = true
serde.workspace = true
tracing.workspace = true

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_System_IO",
  "Win32_System_Threading",
  "Win32_Storage_FileSystem",
  "Win32_Devices_DeviceAndDriverInstallation",
] }
